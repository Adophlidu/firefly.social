packages:
    - 'apps/*'
    - 'packages/*'
    - 'workers/*'

resolutionMode: time-based

overrides:
    '@babel/plugin-transform-modules-systemjs': '>=7.29.4'
    '@noble/curves': 1.9.2
    '@reown/appkit': 1.8.20
    '@solana/wallet-adapter-base': 0.9.27
    '@solana/web3.js': 1.98.4
    '@tanstack/react-query-next-experimental': 5.85.9
    '@tanstack/react-query': 5.85.9
    '@types/node': 22.19.20
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    '@walletconnect/logger': 3.0.2
    '@walletconnect/universal-provider': 2.23.9
    axios: '>=1.16.0'
    bigint-buffer: npm:four-flap-bigint-buffer@^1.1.6
    core-js-compat: 3.49.0
    crypto-js@<4.2.0: '>=4.2.0'
    elliptic: '>=6.6.1'
    fast-uri: '>=3.1.2'
    fast-xml-parser@>=4.1.3 <4.5.4: 4.5.6
    flatted: '>=3.4.2'
    glob@10: '>=10.5.0'
    glob@11: '>=11.1.0'
    h3@1: '>=1.15.6'
    isows: 1.0.7
    js-cookie: '>=3.0.7'
    jotai: 2.19.1
    lodash: 4.18.1
    lodash-es: 4.18.1
    picomatch@2: '>=2.3.2'
    pino: 10.1.1
    preact: '>=10.27.3'
    protobufjs@<7.5.5: 7.5.9
    react: 19.2.7
    react-dom: 19.2.7
    react-use: 17.6.1
    serialize-javascript: '>=7.0.3'
    sha.js: 2.4.12
    svgo@3: '>=3.3.3'
    '@typescript/typescript6>typescript': 5.9.3
    rolldown-plugin-dts>typescript: npm:@typescript/typescript6@^6.0.0
    tsdown>typescript: npm:@typescript/typescript6@^6.0.0
    typescript: npm:@typescript/typescript6@^6.0.0
    uint8arrays: 3.1.1
    # Cap below 8: undici 8 removed `connect.socketPath` support, which Nitro's
    # dev worker uses to fetch over its Unix socket. With 8.x, every dev request
    # fails with "fetch failed" (UND_ERR_INVALID_ARG). nitro (^7.18.2), wrangler
    # and miniflare (both 7.24.8) all want the 7.x line.
    undici: '>=7.24.0 <8'
    use-sync-external-store: 1.5.0
    wrangler: '>=4.59.1'

peerDependencyRules:
    ignoreMissing: []
    allowedVersions:
        react: 19.2.7

packageExtensions:
    '@reown/appkit-utils@1.8.20':
        dependencies:
            '@solana/web3.js': 1.98.4

patchedDependencies:
    '@lens-protocol/client@0.0.0-canary-20250430134539': patches/@lens-protocol__client@0.0.0-canary-20250430134539.patch
    '@lexical/react@0.18.0': patches/@lexical__react@0.18.0.patch
    '@tippyjs/react@4.2.6': patches/@tippyjs__react@4.2.6.patch
    dayjs-twitter@0.5.0: patches/dayjs-twitter@0.5.0.patch
    eslint-plugin-tailwindcss@3.18.2: patches/eslint-plugin-tailwindcss@3.18.2.patch
    react-use@17.6.1: patches/react-use@17.6.1.patch
    twitter-text@3.1.0: patches/twitter-text@3.1.0.patch
    urlcat@3.1.0: patches/urlcat@3.1.0.patch
    '@bprogress/react@1.2.7': patches/@bprogress__react@1.2.7.patch
    '@safe-global/safe-apps-sdk@9.1.0': patches/@safe-global__safe-apps-sdk@9.1.0.patch

minimumReleaseAgeExclude:
    - '@csstools/css-color-parser@4.1.2'
    - axe-core@4.12.1
    - env-runner@0.1.11
    - react-native-worklets@0.9.2
    - typescript@7.0.1-rc
    - '@dimensiondev/rn-ui@0.2.0 || 0.3.0'
    - '@dimensiondev/perps-core@0.3.0 || 0.3.1 || 0.4.0'
    - '@dimensiondev/perps-react@0.3.0 || 0.3.1 || 0.4.0'
    - '@dimensiondev/kline-core@0.4.0'
    - '@dimensiondev/kline-hyperliquid@0.4.0'

allowBuilds:
    '@firebase/util': false
    '@napi-rs/image-android-arm-eabi': false
    '@napi-rs/image-android-arm64': false
    '@napi-rs/image-darwin-arm64': false
    '@napi-rs/image-darwin-x64': false
    '@napi-rs/image-freebsd-x64': false
    '@napi-rs/image-linux-arm-gnueabihf': false
    '@napi-rs/image-linux-arm64-gnu': false
    '@napi-rs/image-linux-arm64-musl': false
    '@napi-rs/image-linux-x64-gnu': false
    '@napi-rs/image-linux-x64-musl': false
    '@napi-rs/image-win32-ia32-msvc': false
    '@napi-rs/image-win32-x64-msvc': false
    '@reown/appkit': false
    '@swc/core': true
    bufferutil: false
    core-js: false
    esbuild: true
    four-flap-bigint-buffer: true
    protobufjs: false
    sharp: true
    unrs-resolver: true
    utf-8-validate: false
    workerd: true
