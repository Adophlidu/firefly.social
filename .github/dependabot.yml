version: 2

# Note: Dependabot can be manually triggered via GitHub UI:
# Go to Insights > Dependabot > Dependabot updates, then click "Check for updates"
updates:
    # Root package.json and pnpm lockfile (workspace root)
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 20
      versioning-strategy: increase
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor

    # Next.js app
    - package-ecosystem: 'npm'
      directory: '/apps/web'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 20
      versioning-strategy: increase
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor

    # Workspace packages (each owns a package.json; lockfile lives at repo root)
