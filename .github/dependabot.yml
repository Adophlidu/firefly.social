version: 2

# Note: Dependabot can be manually triggered via GitHub UI:
# Go to Insights > Dependabot > Dependabot updates, then click "Check for updates"
updates:
    # Root package.json and pnpm workspace
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 20
      versioning-strategy: increase
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor

    # Workspace packages
    - package-ecosystem: 'npm'
      directory: '/packages/iframe-bridge'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 20
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor

    - package-ecosystem: 'npm'
      directory: '/packages/native-bridge'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 20
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor

    - package-ecosystem: 'npm'
      directory: '/packages/utils'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 20
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor

    # GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 20
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
