name: Create Release Pull Request

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: 'Type of release'
                required: false
                default: 'patch'
                type: choice
                options:
                    - major
                    - minor
                    - patch

jobs:
    create-release-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version-file: '.node-version'

            - name: Set up pnpm
              run: |
                  corepack enable
                  corepack prepare pnpm@8.15.8 --activate

            - name: Determine base branch
              id: base_branch
              run: |
                  release_type="${{ github.event.inputs.release_type }}"

                  if [ "$release_type" = "major" ]; then
                    base_branch="main"
                  elif [ "$release_type" = "minor" ]; then
                    base_branch="main"
                  else
                    base_branch="released"
                  fi

                  echo "base_branch=$base_branch" >> $GITHUB_ENV

            - name: Checkout to base branch
              run: |
                  git checkout ${{ env.base_branch }}

            - name: Collect app workspaces and bump versions
              id: bump_version
              run: |
                  set -euo pipefail
                  release_type="${{ github.event.inputs.release_type }}"

                  app_names=()
                  for pkgjson in apps/*/package.json; do
                    [ -f "$pkgjson" ] || continue
                    name=$(node -p "require('./$pkgjson').name")
                    app_names+=("$name")
                  done

                  if [ ${#app_names[@]} -eq 0 ]; then
                    echo "::error::No applications found under apps/*/package.json"
                    exit 1
                  fi

                  current_snapshot=""
                  first=true
                  for pkgjson in apps/*/package.json; do
                    [ -f "$pkgjson" ] || continue
                    name=$(node -p "require('./$pkgjson').name")
                    ver=$(node -p "require('./$pkgjson').version")
                    if [ "$first" = true ]; then
                      current_snapshot="$name@$ver"
                      first=false
                    else
                      current_snapshot="$current_snapshot, $name@$ver"
                    fi
                  done
                  echo "current_snapshot=$current_snapshot" >> $GITHUB_ENV

                  for pkgjson2 in apps/*/package.json; do
                    [ -f "$pkgjson2" ] || continue
                    dir=$(dirname "$pkgjson2")
                    pnpm -C "$dir" version "$release_type" --no-git-tag-version
                  done

                  new_snapshot=""
                  first=true
                  declare -a vers
                  for pkgjson in apps/*/package.json; do
                    [ -f "$pkgjson" ] || continue
                    name=$(node -p "require('./$pkgjson').name")
                    ver=$(node -p "require('./$pkgjson').version")
                    vers+=("$ver")
                    if [ "$first" = true ]; then
                      new_snapshot="$name@$ver"
                      first=false
                    else
                      new_snapshot="$new_snapshot, $name@$ver"
                    fi
                  done
                  echo "new_snapshot=$new_snapshot" >> $GITHUB_ENV

                  new_version=$(printf '%s\n' "${vers[@]}" | sort -u | paste -sd- -)
                  echo "new_version=$new_version" >> $GITHUB_ENV

            - name: Set pull request title
              id: pr_title
              run: |
                  release_type="${{ github.event.inputs.release_type }}"

                  if [ "$release_type" = "major" ]; then
                    pr_title="[Release] New release ${{ env.new_snapshot }} (major)"
                  elif [ "$release_type" = "minor" ]; then
                    pr_title="[Release] New release ${{ env.new_snapshot }} (minor)"
                  else
                    pr_title="[Release] Hotfix ${{ env.current_snapshot }} => ${{ env.new_snapshot }} (patch)"
                  fi

                  echo "pr_title=$pr_title" >> $GITHUB_ENV

            - name: Check if branch already exists
              run: |
                  if git ls-remote --exit-code --heads origin "bump-version-${{ env.new_version }}" >/dev/null 2>&1; then
                    echo "::error::Remote branch bump-version-${{ env.new_version }} already exists"
                    exit 1
                  fi

            - name: Commit and Push changes
              run: |
                  git add apps/*/package.json
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore: bump app versions (${{ env.new_snapshot }})"
                  git checkout -b "bump-version-${{ env.new_version }}"
                  git push origin "bump-version-${{ env.new_version }}"

            - name: Create pull request
              run: |
                  gh pr create -B "${{ env.base_branch }}" -H "bump-version-${{ env.new_version }}" --title "${{ env.pr_title }}" --body "Closes MF-0000"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Connect Domain on Vercel
              continue-on-error: true
              run: |
                  curl -X PATCH https://api.vercel.com/v10/projects/prj_AbXOdfeEB7av0UPeVdCqbw9ZlSKZ/domains/canary.firefly.social \
                       -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                       -H "Content-Type: application/json" \
                       -d '{"gitBranch": "bump-version-${{ env.new_version }}"}'
