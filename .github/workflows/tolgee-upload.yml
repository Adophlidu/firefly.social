name: Tolgee upload

on:
    workflow_dispatch:

jobs:
    upload-sources:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version-file: '.node-version'

            - name: Authenticate NPM
              uses: DimensionDev/github-token-action@latest
              with:
                  registry: true

            - name: Setup Github Actions
              run: .github/scripts/setup.sh

            # Prunes Tolgee keys missing from push.files (push.removeOtherKeys in .tolgeerc.json).
            # Uses the wrapper script to skip untranslated plural entries, which Tolgee would
            # otherwise convert to empty ICU strings like `{value, plural, other {}}`.
            - name: Push locale files to Tolgee (web)
              env:
                  TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
                  TOLGEE_PROJECT_ID: ${{ secrets.TOLGEE_PROJECT_ID }}
              run: pnpm --filter @dimensiondev/firefly-web tolgee:push

            - name: Push locale files to Tolgee (wallet)
              env:
                  TOLGEE_API_KEY: ${{ secrets.FIREFLY_WALLET_TOLGEE_API_KEY }}
                  TOLGEE_PROJECT_ID: ${{ secrets.FIREFLY_WALLET_TOLGEE_PROJECT_ID }}
              run: pnpm --filter @dimensiondev/firefly-wallet tolgee:push
