name: Compare OG Images

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'public/og/**'
            - 'scripts/compare-images.mjs'
            - '.github/workflows/compare-images.yml'

jobs:
    compare-images:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8.15.8

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Compare images
              run: pnpm exec node scripts/compare-images.mjs
              env:
                  BASE_URL: https://staging.firefly.social

            - name: Upload comparison results
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: image-comparison-results
                  path: |
                      .image-comparison/*.png
                      .image-comparison/*.diff.png
                  retention-days: 7
