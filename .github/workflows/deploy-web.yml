name: Deploy Web

on:
    push:
        branches:
            - main
            - ssr-migration
        paths:
            - 'apps/web/**'
            - 'packages/**'
            - '.github/workflows/deploy-web.yml'
            - '.github/scripts/setup.sh'
    workflow_dispatch:
        inputs:
            environment:
                description: 'Deploy environment'
                required: true
                default: staging
                type: choice
                options:
                    - staging
                    - production

permissions:
    contents: read
    packages: read

concurrency:
    group: deploy-web-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version-file: '.node-version'

            - name: Authenticate NPM
              uses: DimensionDev/github-token-action@latest
              with:
                  registry: true

            - name: Setup Github Actions
              run: .github/scripts/setup.sh

            - name: Build web (client + server bundles)
              env:
                  NEXT_PUBLIC_VERCEL_ENV: staging
                  NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
                  NEXT_PUBLIC_FIREFLY_ROOT_URL: ${{ secrets.NEXT_PUBLIC_FIREFLY_ROOT_URL }}
                  NEXT_PUBLIC_W3M_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_W3M_PROJECT_ID }}
                  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
                  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
                  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
                  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
                  NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
              run: pnpm --filter @dimensiondev/firefly-web run build

            - name: Write runtime secrets (.dev.vars)
              # The worker validates internal env vars at startup (zod schema in
              # packages/envs), and Cloudflare's upload-time version check executes
              # that code — the required bindings must ship with the version.
              env:
                  TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
                  TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
                  APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
                  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
                  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
                  SESSION_CIPHER_KEY: ${{ secrets.SESSION_CIPHER_KEY }}
                  SESSION_CIPHER_IV: ${{ secrets.SESSION_CIPHER_IV }}
                  FARCASTER_SIGNER_FID: ${{ secrets.FARCASTER_SIGNER_FID }}
                  FARCASTER_SIGNER_MNEMONIC: ${{ secrets.FARCASTER_SIGNER_MNEMONIC }}
                  FIREFLY_JWT_SECRET: ${{ secrets.FIREFLY_JWT_SECRET }}
                  ORB_API_KEY: ${{ secrets.ORB_API_KEY }}
                  ORB_SUPABASE_URL: ${{ secrets.ORB_SUPABASE_URL }}
                  ORB_SUPABASE_ANON_KEY: ${{ secrets.ORB_SUPABASE_ANON_KEY }}
              run: |
                  set -euo pipefail
                  for key in TWITTER_CLIENT_ID TWITTER_CLIENT_SECRET \
                      GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                      APPLE_CLIENT_ID APPLE_CLIENT_SECRET \
                      NEXTAUTH_SECRET NEXTAUTH_URL \
                      SESSION_CIPHER_KEY SESSION_CIPHER_IV \
                      FARCASTER_SIGNER_FID FARCASTER_SIGNER_MNEMONIC \
                      FIREFLY_JWT_SECRET ORB_API_KEY \
                      ORB_SUPABASE_URL ORB_SUPABASE_ANON_KEY; do
                    printf '%s="%s"\n' "$key" "${!key}" >> .dev.vars
                  done

            - name: Deploy to Cloudflare Workers
              env:
                  # NOTE: same personal-account secrets as deploy-wallet.yml —
                  # the demo staging lives outside the company account (the
                  # company account uses CLOUDFLARE_API_TOKEN/ACCOUNT_ID in
                  # deploy-workers.yml).
                  CLOUDFLARE_API_TOKEN: ${{ secrets.WALLET_CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WALLET_CLOUDFLARE_ACCOUNT_ID }}
                  DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
              run: |
                  set -euo pipefail
                  if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
                    echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
                    exit 1
                  fi
                  # Push events always go to staging; production is manual only.
                  if [ "${{ github.event_name }}" = "push" ]; then
                    DEPLOY_ENV=staging
                  fi
                  pnpm --filter ./apps/web run deploy --env "$DEPLOY_ENV"
