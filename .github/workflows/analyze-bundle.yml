name: Bundle Analysis

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - released

jobs:
    analyze-bundle:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate NPM
              uses: DimensionDev/github-token-action@latest
              with:
                  registry: true

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'

            - name: Setup GitHub Actions
              run: ./scripts/setup-gh-actions.sh

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Generate Statoscope report
              run: ANALYZE_STATOSCOPE=true pnpm build
              env:
                  NODE_OPTIONS: --max_old_space_size=8192

            - name: Generate webpack-bundle-analyzer report
              run: ANALYZE=true pnpm build
              env:
                  NODE_OPTIONS: --max_old_space_size=8192

            - name: Upload webpack-bundle-analyzer report
              uses: actions/upload-artifact@v5
              with:
                  name: nodejs-report
                  path: .next/analyze/nodejs.html
                  retention-days: 30

            - name: Upload webpack-bundle-analyzer report
              uses: actions/upload-artifact@v5
              with:
                  name: edge-report
                  path: .next/analyze/edge.html
                  retention-days: 30

            - name: Upload webpack-bundle-analyzer report
              uses: actions/upload-artifact@v5
              with:
                  name: client-report
                  path: .next/analyze/client.html
                  retention-days: 30

            - name: Create analysis summary
              run: |
                  echo "## Bundle Analysis Reports Generated" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### 📈 Webpack Bundle Analyzer Reports" >> $GITHUB_STEP_SUMMARY
                  echo "Generated and uploaded as artifacts:" >> $GITHUB_STEP_SUMMARY
                  echo "- **Node.js Report**: \`nodejs-report\` (nodejs.html)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Edge Runtime Report**: \`edge-report\` (edge.html)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Client Report**: \`client-report\` (client.html)" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Note:** All reports are available as workflow artifacts for 30 days."
