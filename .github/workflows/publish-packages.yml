name: Publish packages

on:
    workflow_dispatch:
        inputs:
            bump_type:
                description: 'Semver bump applied to every package (from current highest package version)'
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: write
    pull-requests: write
    packages: write

concurrency:
    group: publish-packages-${{ github.repository }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version-file: '.node-version'

            - name: Authenticate NPM
              uses: DimensionDev/github-token-action@latest
              with:
                  registry: true

            - name: Setup Github Actions
              run: ./scripts/setup-gh-actions.sh

            - name: Bump all package versions
              id: bump
              run: |
                  NEW_VERSION=$(node scripts/bump-packages-version.mjs "${{ github.event.inputs.bump_type }}")
                  echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

            - name: Publish to GitHub Packages
              run: pnpm -r --filter='./packages/*' publish --no-git-checks

            - name: Create branch, commit, PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  NEW_VERSION="${{ steps.bump.outputs.new_version }}"
                  BUMP_TYPE="${{ github.event.inputs.bump_type }}"
                  BRANCH="chore/publish-packages-v${NEW_VERSION}"

                  if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                    echo "::error::Branch $BRANCH already exists on remote"
                    exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git checkout -b "$BRANCH"
                  git add packages/*/package.json pnpm-lock.yaml

                  if git diff --cached --quiet; then
                    echo "::error::No staged changes after version bump"
                    exit 1
                  fi

                  git commit -m "chore(packages): bump workspace packages to v${NEW_VERSION}"
                  git push origin "$BRANCH"

                  TITLE="chore(packages): bump @dimensiondev/* to v${NEW_VERSION}"

                  body_file="$(mktemp)"
                  {
                    echo '## Summary'
                    echo ''
                    echo "Records **v${NEW_VERSION}** for all \`packages/*\` after they were built and published to GitHub Packages ([workflow run]($WORKFLOW_RUN_URL))."
                    echo ''
                    echo "**Bump type:** \`$BUMP_TYPE\`"
                    echo ''
                    echo '### Notes'
                    echo ''
                    echo '- Registry: `npm.pkg.github.com` (per package `publishConfig`).'
                    echo '- Merge to align `main` with published artifacts and `pnpm-lock.yaml`.'
                  } > "$body_file"

                  gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$body_file"
                  rm -f "$body_file"
