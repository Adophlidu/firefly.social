name: Publish Packages

on:
    push:
        tags:
            - 'packages@*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version bump (major, minor, patch) or specific version (e.g., 1.2.3). Leave empty to publish current version.'
                required: false
                type: string
            package:
                description: 'Specific package to publish (e.g., @dimensiondev/utils). Leave empty to publish all packages.'
                required: false
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Authenticate NPM
              uses: DimensionDev/github-token-action@latest
              with:
                  registry: true

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@dimensiondev'

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Build packages
              run: pnpm run packages:build

            - name: Configure npm for pnpm publish
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
                  if ! grep -q "^@dimensiondev:registry" .npmrc 2>/dev/null; then
                    echo "@dimensiondev:registry=https://npm.pkg.github.com/" >> .npmrc
                  fi

            - name: Publish packages
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                    PACKAGE="${{ github.event.inputs.package }}"
                    
                    if [ -n "$PACKAGE" ]; then
                      PACKAGE_DIR=$(echo $PACKAGE | cut -d'/' -f2)
                      cd packages/$PACKAGE_DIR
                      
                      # Bump version (major, minor, patch, or specific version)
                      if [ -n "$VERSION" ]; then
                        npm version $VERSION --no-git-tag-version
                      fi
                      
                      cd ../..
                      pnpm --filter "$PACKAGE" publish --no-git-checks
                    else
                      # Publish all packages
                      if [ -n "$VERSION" ]; then
                        pnpm -r --filter './packages/*' exec -- npm version $VERSION --no-git-tag-version || true
                      fi
                      pnpm -r --filter './packages/*' publish --no-git-checks
                    fi
                  else
                    # Publish from tag (format: packages@0.1.0)
                    TAG_NAME="${{ github.ref_name }}"
                    VERSION=$(echo $TAG_NAME | sed 's/packages@//')
                    
                    pnpm -r --filter './packages/*' exec -- npm version $VERSION --no-git-tag-version || true
                    pnpm -r --filter './packages/*' publish --no-git-checks
                  fi

            - name: Create Git tag and push (if manual dispatch)
              if: github.event_name == 'workflow_dispatch'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ -z "${{ github.event.inputs.version }}" ]; then
                    exit 0
                  fi

                  VERSION="${{ github.event.inputs.version }}"
                  PACKAGE="${{ github.event.inputs.package }}"

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  if [ -n "$PACKAGE" ]; then
                    PACKAGE_NAME=$(echo $PACKAGE | cut -d'/' -f2)
                    NEW_VERSION=$(node -p "require('./packages/$PACKAGE_NAME/package.json').version")
                    git add packages/$PACKAGE_NAME/package.json
                    git commit -m "chore: bump $PACKAGE to $NEW_VERSION" || true
                    git tag "$PACKAGE_NAME@$NEW_VERSION" || true
                  else
                    NEW_VERSION=$(node -p "require('./packages/utils/package.json').version")
                    git add packages/*/package.json
                    git commit -m "chore: bump packages to $NEW_VERSION" || true
                    git tag "packages@$NEW_VERSION" || true
                  fi

                  git push origin main --follow-tags || true
