name: Maintenance

on:
    push:
        branches:
            - '**'
            - '!main'
            - '!released'
    pull_request:
        paths:
            - 'package.json'
            - 'apps/web/package.json'
            - 'apps/wallet/package.json'
            - 'pnpm-lock.yaml'
    workflow_dispatch:

jobs:
    maintenance:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version-file: '.node-version'

            - name: Authenticate NPM
              uses: DimensionDev/github-token-action@latest
              with:
                  registry: true

            - name: Setup Github Actions
              run: .github/scripts/setup.sh

            - name: Run Lingui
              run: pnpm -r --filter='./apps/*' run lingui

            - name: Run Prettier
              run: npx prettier . -w

            - name: Run ESLint
              run: |
                  npx eslint --fix . || echo "ESLint completed with warnings"

            - name: Commit and Push changes if necessary
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  if [[ $(git status --porcelain) ]]; then
                    git add ./
                    git commit -m "chore: code maintenance [bot]"
                    git push origin
                  else
                    echo "No changes to commit."
                  fi

    analysis:
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'

            - name: Authenticate NPM
              uses: DimensionDev/github-token-action@latest
              with:
                  registry: true

            - name: Setup Github Actions
              run: .github/scripts/setup.sh

            - name: Generate Package Analysis
              run: node .github/scripts/generate-package-analysis.mjs

            - name: Commit and Push changes if necessary
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  if [[ $(git status --porcelain) ]]; then
                    git add apps/web/docs/PACKAGE_ANALYSIS.txt apps/wallet/docs/PACKAGE_ANALYSIS.txt
                    git commit -m "chore: regenerate PACKAGE_ANALYSIS.txt [bot]"
                    git push origin HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
                  else
                    echo "No changes to commit."
                  fi
